name: Render Automation Video

on:
  repository_dispatch:
    types: [render_and_upload]
  workflow_dispatch:

jobs:
  build_video:
    runs-on: ubuntu-latest
    # Anti-Hang Fix 1: Agar 15 minute me nahi hua toh cancel kar dega (hang nahi hoga)
    timeout-minutes: 15 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip' # Dependency caching se speed badhegi

      # Anti-Hang Fix 2: Official FFmpeg action (Zyada stable aur tez)
      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v2

      - name: Install System Dependencies (ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick fonts-dejavu
          # ImageMagick TextClip Bug Fix
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests moviepy==1.0.3 Pillow==9.5.0 edge-tts

      - name: Run Python Engine
        env:
          FULL_TEXT: ${{ github.event.client_payload.full_text }}
          SCENES_DATA: ${{ github.event.client_payload.scenes_data }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          RESUME_URL: ${{ github.event.client_payload.resume_url }}
          WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        # Unbuffered output (-u) taaki logs turant dikhein, ruka hua na lage
        run: python -u render_video.py
